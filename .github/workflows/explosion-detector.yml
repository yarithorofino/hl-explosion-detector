# Detector de explosiones de perpetuos en Hyperliquid.
# El cron solo corre cuando este fichero está en la rama por defecto (main).
# En este repo GitHub a menudo arranca el horario solo una vez por hora.
# Cada arranque hace varias pasadas, separadas unos 15 minutos.
# Los secrets se pasan por el entorno del paso y no se imprimen.

name: Detector de explosiones

on:
  workflow_dispatch:
    inputs:
      force_test_post:
        description: "Enviar un POST de prueba al webhook (una sola pasada, sin bucle)"
        required: false
        default: false
        type: boolean
      iterations:
        description: "Número de pasadas (la prueba del webhook ignora esto y hace 1)"
        required: false
        default: 5
        type: number

# No se cancela la ejecución que está a punto de guardar el estado.
# Si llega otra, espera. El bucle, tras guardar, mira la cola y cede el sitio
# para no repetir el mismo cuarto de hora.
concurrency:
  group: explosion-detector
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: detectar
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasadas del detector
        env:
          EXPLOSION_WEBHOOK_URL: ${{ secrets.EXPLOSION_WEBHOOK_URL }}
          EXPLOSION_WEBHOOK_AUTH: ${{ secrets.EXPLOSION_WEBHOOK_AUTH }}
          FORCE_TEST_POST: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.force_test_post == 'true' || inputs.force_test_post == true) && 'true' || 'false' }}
          SCAN_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.iterations || '5' }}
          PYTHONUNBUFFERED: "1"
        run: bash scripts/scan_loop.sh
